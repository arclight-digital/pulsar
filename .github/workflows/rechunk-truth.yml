# The rechunk path, exercised against a toy image in minutes.
#
# This workflow used to BE the test: four hand-written variants, each asking
# the runner a question that took a dispatch and a wait to answer. Three of
# them turned out to be measuring the harness -- a mount that hit an ostree
# symlink, an unseeded output layout -- and the one real verdict was
# misleading, because "Trying to pull" in a combined log is equally the outer
# podman failing to find the TOOL image and the tool failing to find --from.
#
# The test is now scripts/rechunk-selftest.sh, which runs the same questions
# on a workstation in about the time this file took to queue. That is the
# point: the rechunk half of the build was the half with no local path, so
# every question about it cost a CI round trip, and on the day GitHub Actions
# was degraded it could not be asked at all. Run locally, it settled in
# minutes what the dispatch-and-wait loop had got backwards -- that --from
# takes a bare containers-storage name, that an explicit transport is a parse
# error, and that a store it cannot read is pulled from a registry silently.
#
# What remains here is the same script, run where the runner's filesystem
# layout differs from a workstation's: /mnt is a real directory on Ubuntu and
# a symlink inside the image, which is exactly the difference that caused the
# bug. Local runs cannot cover that, so this is not redundant -- it is the
# part of the matrix a workstation does not have.
#
# Run: gh workflow run rechunk-truth.yml
name: rechunk-truth

on:
  workflow_dispatch:

jobs:
  truth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The same bind mount build.yml makes, and for the same reason: the
      # store has to sit at a path that survives symlink resolution inside
      # the tool image. The selftest derives its mounts from podman info,
      # so it follows this automatically.
      - name: Put container storage on the temp disk
        run: |
          sudo mkdir -p /var/mnt
          sudo mount --bind /mnt /var/mnt
          sudo mkdir -p /var/mnt/podman && sudo chown "$(id -u):$(id -g)" /var/mnt/podman
          printf '[storage]\ndriver = "overlay"\ngraphroot = "/var/mnt/podman"\nrunroot = "/tmp/podman-run"\n' \
            > /tmp/storage.conf
          echo "CONTAINERS_STORAGE_CONF=/tmp/storage.conf" >> "$GITHUB_ENV"
          df -h / /var/mnt

      - name: Rechunk selftest
        run: scripts/rechunk-selftest.sh --work /var/mnt/selftest
