# Pulsar's gamemode overrides.
#
# gamemoded MERGES config from /usr/share/gamemode/, then /etc/, then
# $XDG_CONFIG_HOME, then $PWD -- later wins, per-key. So this file is not a
# copy of the packaged gamemode.ini with edits; it is only the keys where
# Pulsar disagrees with the default, and everything absent here is
# deliberately inherited. Diffing this against the package file is the wrong
# reflex: the short list IS the content.
#
# /etc rather than /usr/lib, which is this image's usual home for config it
# owns, for the plain reason that /usr/lib is not in the search path above.
# gamemode's own error text ("Consider moving this option to
# /etc/gamemode.ini") names /etc as the system override. The alternative --
# overwriting the package's /usr/share/gamemode/gamemode.ini -- would put a
# file this image owns where the RPM expects its own, for no gain.

[general]
# THE ONE THAT COSTS FRAMES ON THIS HARDWARE.
#
# gamemode's reaper samples iGPU watts / CPU watts every reaper_freq seconds
# and, above igpu_power_threshold (default 0.3), decides the integrated GPU is
# doing the rendering and demotes the CPU governor to igpu_desiredgov --
# powersave -- while the game runs.
#
# That heuristic is written for machines where the iGPU IS the game's GPU. The
# target here is an Arrow Lake-HX iGPU sitting next to a Max-Q RTX 5080 with
# the panel wired to the Intel side, so the iGPU draws real, continuous power
# doing composition and scanout for a game rendering entirely on the NVIDIA
# card. The ratio is measuring the wrong thing, and the action it takes on the
# answer is to throttle the CPU mid-game.
#
# -1 disables iGPU checking outright and keeps desiredgov (performance) for
# the whole session, which is what a discrete-GPU machine wants. On a future
# iGPU-only Pulsar host this is the line to revisit first.
igpu_power_threshold=-1

# Renice games to -10.
#
# The grant for this ALREADY SHIPS and nothing was claiming it: the gamemode
# RPM installs /etc/security/limits.d/10-gamemode.conf with "@gamemode - nice
# -10", and upstream's renice default of 0 means gamemoded never asks. This
# turns on a capability the image was already carrying.
#
# REQUIRES GROUP MEMBERSHIP, which is account state an image cannot bake.
# pulsar-gamemode-group.service enrols every human account on first boot and
# `pulsar setup gamemode` does it on demand; see the script for why the first
# session after an install still will not have it.
#
# If enrolment has not happened, gamemoded logs the failed setpriority and
# carries on -- every other optimisation still applies. The failure mode is a
# missing win, not a broken gamemode.
renice=10

# INHERITED, DELIBERATELY, and written down so it is not "fixed" later:
#
#   ioprio=0        Inert on this image, exactly as documented at length in
#                   systemd/system/user.slice.d/10-pulsar-io-latency.conf.
#                   I/O priority is honoured by bfq and blk-iocost; this image
#                   selects neither (scheduler reads [none] on NVMe), so the
#                   value is set, looks set, and does nothing. Left at the
#                   default because changing it would also do nothing, and a
#                   line here would imply it works. The io.latency drop-in is
#                   the mechanism that actually protects session I/O.
#
#   disable_splitlock=1
#                   Already the upstream default, and already redundant here:
#                   sysctl.d/60-pulsar-gaming.conf sets
#                   kernel.split_lock_mitigate=0 unconditionally, for every
#                   process, at boot. gamemode would set the same knob for the
#                   duration of a game. The sysctl is the broader call and is
#                   the one to change if this is ever revisited; this key is
#                   left alone so that a machine running gamemode without the
#                   sysctl (a fork, a container) still gets the behaviour.
#
#   park_cores / pin_cores
#                   Unset, so gamemode's default applies: parking off, pinning
#                   on, with autodetection that explicitly covers Intel parts
#                   with P- and E-cores -- which is this hardware. Pinning
#                   games to the 8 P-cores is very likely right here, and that
#                   is precisely why it is NOT written out: the default is
#                   already the desired behaviour, and pinning it in config
#                   would freeze today's upstream heuristic against a CPU
#                   topology that changes every generation. Recorded as a
#                   dependency on an upstream default, not adopted as policy.
#
#   softrealtime=off
#                   SCHED_ISO does not exist in upstream kernels. Nothing to
#                   turn on.
