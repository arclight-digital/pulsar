# nouveau must never touch a GPU the nvidia driver owns. This file rides in
# the initramfs (the second dracut regen in Containerfile.nvidia exists for
# it), so the blacklist holds from earliest boot -- the kargs.d entries are
# a second layer on top, not the load-bearing one.
blacklist nouveau
options nouveau modeset=0

# Preserve VRAM across suspend/resume. Without this a hybrid laptop commonly
# comes back from S3 with a corrupted or black display.
options nvidia NVreg_PreserveVideoMemoryAllocations=1
# Where that VRAM goes: with no path, the 615 driver's kernel suspend
# notifiers cannot reserve space and abort every suspend ("FBSR: could not
# reserve space"), so the machine stays awake with the lid shut. Not tmpfs,
# which would hold the copy in the RAM it is being saved to. Not /var/tmp
# either: the notifiers open the file as systemd-sleep, and SELinux lets
# systemd_sleep_t write nothing labeled tmp_t ("module parameter could not
# be opened (error -13)", the same FBSR abort). systemd-sleep's own state
# directory is the one on-disk place its policy lets it create and write;
# 60-pulsar-nvidia-sleep.conf makes sure it exists before the first suspend.
options nvidia NVreg_TemporaryFilePath=/var/lib/systemd/sleep

# Required for Wayland. fbdev=1 gives a working console + smooth handoff
# from plymouth instead of a mode flicker.
options nvidia-drm modeset=1 fbdev=1
