# thermald 2.5.13 reads Intel DPTF "odvp" (OEM design variable) attributes by
# index, and on Arrow Lake it walks indices far past what the firmware
# exposes: sysfs has odvp0..odvp5 under INTC1042:00, and it asks for odvp8198
# and up, forever. Each miss is one journal line. On cherenkov that was
# 1,148,435 lines in one boot -- 88% of everything journald stored -- and
# enough of them to rotate out the logs anyone would actually need.
#
# Dropped at the journal, by exact message, rather than by lowering thermald's
# log level: every other thing thermald has to say still gets through. Not an
# upstream default being overridden -- a named upstream bug being muted.
# Remove when thermald stops asking for indices that do not exist.
[Service]
LogFilterPatterns=~^Unable to read odvp[0-9]+$
