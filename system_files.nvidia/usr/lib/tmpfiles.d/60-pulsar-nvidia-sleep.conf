# Where the nvidia driver saves video memory on suspend (NVreg_TemporaryFilePath
# in nvidia-pulsar.conf). systemd-sleep makes this directory only the first time
# it needs it, so a fresh install would fail its first suspend without it; made
# here, it gets the systemd_sleep_var_lib_t label the driver's writes depend on.
d /var/lib/systemd/sleep 0700 root root -
