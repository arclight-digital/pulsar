# A speaker on the network (AirPlay and the rest) is never made the default
# output or the fallback on its own; see scripts/pulsar/network-sinks.lua.
wireplumber.components = [
  {
    name = pulsar/network-sinks.lua, type = script/lua
    provides = custom.pulsar-network-sinks
  }
]

wireplumber.profiles = {
  main = {
    custom.pulsar-network-sinks = required
  }
}
