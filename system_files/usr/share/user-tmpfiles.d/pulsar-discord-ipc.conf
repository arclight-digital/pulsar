# Flatpak Discord listens in its own folder of the runtime directory; programs
# on the host (AppImages, native games, anything with Discord Rich Presence)
# look for $XDG_RUNTIME_DIR/discord-ipc-0. Made at each login. A Discord
# installed another way makes its own socket there, and this leaves it alone.
L %t/discord-ipc-0 - - - - app/com.discordapp.Discord/discord-ipc-0
