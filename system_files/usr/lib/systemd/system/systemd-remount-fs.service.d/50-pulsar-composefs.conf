# The only entry in `systemctl --failed` on every boot of every installed
# Pulsar system:
#
#   mount: /: fsconfig() failed: overlay: No changes allowed in reconfigure
#
# / is a composefs overlay, but the fstab Anaconda writes still describes the
# btrfs subvolume under it (`/ btrfs subvol=root,compress=zstd:1,ro`), and
# systemd-remount-fs tries to apply those btrfs options to the overlay. There
# is nothing on a composefs root to remount -- it is read-only by
# construction, and /var, /home and /boot are mounted by their own units, not
# by this one -- so the service is skipped, not failed, when / is an overlay.
# A root that is not an overlay still gets remounted exactly as before.
#
# `$$` is systemd's escape for a literal `$`.
[Service]
ExecCondition=/usr/bin/sh -c '[ "$$(findmnt -no FSTYPE /)" != overlay ]'
