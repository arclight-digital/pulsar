# Installing next to another system: no Format= and no sizes, so this matches
# the disk's existing EFI system partition and leaves it as it is. Weight=0:
# without it, an ESP with free space right after it was grown into that space
# (and the plan refused). On a disk with no ESP, repart would instead CREATE
# an unformatted one out of the free space (tested), so pulsar-install-disk
# refuses any plan that does that.
[Partition]
Type=esp
Weight=0
