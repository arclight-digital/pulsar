# Split-lock detection stalls the offending process ~10ms per hit as a
# misbehaviour deterrent. Several Windows games (God of War, THPS 1+2) do
# split locks constantly and drop to a slideshow under it. This is a gaming
# image: keep the performance, lose the deterrent.
kernel.split_lock_mitigate = 0

# Proton games with huge address-space appetites (Star Citizen, some UE5
# titles) exhaust Fedora's 1M default and crash. Match Bazzite's value.
vm.max_map_count = 2147483642

# Proactive compaction is background work nobody asked for. kcompactd wakes on
# this score and shuffles pages to build free hugepage-sized blocks ahead of
# demand; at Fedora's default of 20 that is a periodic, unpredictable cost paid
# on a machine with 62GB of RAM and no memory pressure to speak of. The pages
# it is preparing are the ones the tmpfiles drop-in just stopped anyone waiting
# synchronously for, so this is the other half of that change rather than an
# independent opinion: with defrag deferred, kcompactd already runs when a
# hugepage is actually wanted, and running it on a timer as well buys nothing.
#
# 0 disables proactive compaction ONLY. Direct compaction on allocation and
# kcompactd's on-demand wakeups are untouched -- this is not "no compaction".
vm.compaction_proactiveness = 0

# 66MB of reclaim headroom in front of 62GB of RAM, which is what the kernel's
# own formula produces here (4 * sqrt(16 * totalram_pages) in KB, capped) and
# is a figure that stopped scaling somewhere around 8GB machines. A game that
# allocates hard enough to outrun the watermark does not get a slow allocation,
# it gets DIRECT reclaim: the allocating thread itself walks the LRU looking
# for something to evict, mid-frame.
#
# 512MB is the buffer that keeps kswapd doing that work in the background
# instead. It is 0.8% of RAM -- the cost is memory that was never going to be
# the constraint on this machine, and the win is that the frame-time spike has
# nowhere to come from.
vm.min_free_kbytes = 524288
