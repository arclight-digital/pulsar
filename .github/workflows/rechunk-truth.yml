# ===========================================================================
# Which --from invocation actually reads the image we just built?
#
# The first run of this workflow answered the question it was written for.
# `--from localhost/toy:44` did not resolve out of containers-storage, and
# the tool did not fail: it fell back to treating the name as a REGISTRY
# reference and pulled it.
#
#   Trying to pull localhost/toy:44...
#   Error: initializing source docker://localhost/toy:44: pinging container
#   registry localhost: dial tcp [::1]:443: connect: connection refused
#
# `localhost` is not a registry, so the test failed loudly. Production's
# name IS one. `--from ghcr.io/arclight-digital/pulsar:44` has therefore
# been pulling the PUBLISHED image every night and re-chunking that, while
# the freshly built image sat in local storage untouched -- which is why
# every build since 44.20260806.1 shipped .1's content, and why it is the
# authored files that froze while RPM content appeared to move.
#
# So the remaining question is narrow: what makes the tool read local
# storage? Each variant runs until it either says "Generating commit"
# (resolved locally, the answer) or "Trying to pull" (fell back again).
# That verdict arrives in seconds, so no variant is allowed to run long
# enough to finish chunking -- 90s is far past the decision point.
#
# Run: gh workflow run rechunk-truth.yml
# ===========================================================================
name: rechunk-truth

on:
  workflow_dispatch:

jobs:
  truth:
    runs-on: ubuntu-latest
    steps:
      - name: Put container storage on the temp disk
        run: |
          sudo mkdir -p /mnt/podman && sudo chown "$(id -u):$(id -g)" /mnt/podman
          printf '[storage]\ndriver = "overlay"\ngraphroot = "/mnt/podman"\nrunroot = "/tmp/podman-run"\n' \
            > /tmp/storage.conf
          echo "CONTAINERS_STORAGE_CONF=/tmp/storage.conf" >> "$GITHUB_ENV"
          sudo mkdir -p /mnt/oci && sudo chown "$(id -u):$(id -g)" /mnt/oci

      # One marker per class of content that froze: a packaged file modified
      # after install, an unpackaged file, and a generated file in a
      # package-owned directory. The tag is what --from resolves.
      - name: Build the toy image
        run: |
          set -euo pipefail
          {
            echo 'FROM quay.io/fedora-ostree-desktops/silverblue:44'
            printf 'RUN sed -i %ss|^VERSION=.*|VERSION="TOY"|%s /usr/lib/os-release \\\n' "'" "'"
            printf ' && echo TOY > /usr/lib/toy-unowned \\\n'
            printf ' && echo TOY > /usr/share/pixmaps/toy-generated\n'
          } > Containerfile.toy
          cat Containerfile.toy
          podman build -f Containerfile.toy -t localhost/toy:44 .
          podman images

      - name: Which invocation reads local storage?
        run: |
          # Every variant here is EXPECTED to exit non-zero -- timeout kills
          # the ones that resolve, and the ones that fall back error out. The
          # runner invokes this with `bash -e`, which set -uo does not clear,
          # so the first attempt would take the whole step down before a
          # single verdict printed. It did exactly that on the first try.
          set +e
          set -uo pipefail

          # "Generating commit" = resolved from storage, which is the whole
          # question. "Trying to pull" = the silent fallback that caused this.
          verdict() {
            local name="$1" log="$2"
            if grep -q "Trying to pull" "${log}"; then
              echo "  ${name}: FELL BACK TO REGISTRY PULL"
            elif grep -qE "Generating commit|Building package mapping" "${log}"; then
              echo "  ${name}: RESOLVED FROM LOCAL STORAGE"
            else
              echo "  ${name}: inconclusive"
              tail -6 "${log}" | sed 's/^/      /'
            fi
          }

          # 1. Exactly what build.yml does today, as the control.
          timeout 90 podman run --rm --privileged \
            -v /mnt/podman:/var/mnt/podman \
            -v /mnt/oci:/var/mnt/oci \
            -v /tmp/storage.conf:/etc/containers/storage.conf:ro \
            localhost/toy:44 \
            rpm-ostree compose build-chunked-oci --bootc --format-version 1 \
              --from localhost/toy:44 \
              --output "oci:/mnt/oci/a:build" > /tmp/a.log 2>&1
          verdict "as-shipped (graphroot /mnt/podman, mounted at /var/mnt/podman)" /tmp/a.log

          # 2. The mount at the path storage.conf actually declares -- what
          #    the comment above the step has always claimed it was doing.
          timeout 90 podman run --rm --privileged \
            -v /mnt/podman:/mnt/podman \
            -v /mnt/oci:/mnt/oci \
            -v /tmp/storage.conf:/etc/containers/storage.conf:ro \
            localhost/toy:44 \
            rpm-ostree compose build-chunked-oci --bootc --format-version 1 \
              --from localhost/toy:44 \
              --output "oci:/mnt/oci/b:build" > /tmp/b.log 2>&1
          verdict "same-path mount" /tmp/b.log

          # 3. Same, with the transport stated instead of inferred: if the
          #    ref cannot be read as a registry name, the fallback cannot
          #    fire silently.
          timeout 90 podman run --rm --privileged \
            -v /mnt/podman:/mnt/podman \
            -v /mnt/oci:/mnt/oci \
            -v /tmp/storage.conf:/etc/containers/storage.conf:ro \
            localhost/toy:44 \
            rpm-ostree compose build-chunked-oci --bootc --format-version 1 \
              --from containers-storage:localhost/toy:44 \
              --output "oci:/mnt/oci/c:build" > /tmp/c.log 2>&1
          verdict "same-path mount + explicit containers-storage transport" /tmp/c.log

          # 4. The storage the runner writes is ROOTLESS; the tool runs as
          #    root inside the container. If that is what it cannot read,
          #    building as root is the fix rather than any mount path.
          sudo CONTAINERS_STORAGE_CONF=/tmp/storage.conf podman build \
            -f Containerfile.toy -t localhost/toy-root:44 . > /tmp/rootbuild.log 2>&1 \
            || tail -5 /tmp/rootbuild.log
          sudo timeout 90 podman run --rm --privileged \
            -v /mnt/podman:/mnt/podman \
            -v /mnt/oci:/mnt/oci \
            -v /tmp/storage.conf:/etc/containers/storage.conf:ro \
            localhost/toy-root:44 \
            rpm-ostree compose build-chunked-oci --bootc --format-version 1 \
              --from localhost/toy-root:44 \
              --output "oci:/mnt/oci/d:build" > /tmp/d.log 2>&1
          verdict "rootful build + rootful tool, same-path mount" /tmp/d.log

          echo
          echo "=== full output of each attempt ==="
          for f in a b c d; do
            echo "--- ${f} ---"
            head -20 "/tmp/${f}.log"
          done
