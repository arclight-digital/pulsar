# Keep the update daemon from competing with the desktop on equal footing.
#
# rpm-ostreed ships with no resource controls at all: CPUWeight unset,
# IOWeight unset, MemoryMax=infinity, Nice=0. What it then does during an
# upgrade is not a background trickle -- a 135,067-solvable depsolve, zstd
# decompression, and SHA256 over 946MB -- and it does all of it at the same
# priority as the compositor.
#
# CPUWeight is the whole of the fix here, and that is deliberate. It is the
# highest-confidence lever available on this image: unlike the I/O knobs it
# has no scheduler dependency and no device model to get wrong, and the CPU
# controller honours it unconditionally on every machine this ships to. Same
# containment pattern as scx.service, for the same reason -- a component that
# can saturate the machine gets a bound, so its worst day is something you
# notice rather than something you fight.
#
# 50 against the default 100: the session outranks the updater two to one when
# they contend, and nothing changes at all when they do not. An upgrade the
# user asked for still gets the whole machine while the machine is idle.
#
# NOT SET, and each for a reason worth keeping:
#
#   IOWeight= / IOSchedulingClass=
#     Inert on this image. io.weight needs bfq or blk-iocost and we ship
#     scheduler=none with no iocost model; ionice is scheduler-dependent in
#     the same way. Setting either would look like I/O containment and provide
#     none -- which is precisely the trap uresourced already fell into here.
#     The working I/O lever is io.latency on the protected side; it lives in
#     user.slice.d/10-pulsar-io-latency.conf.
#
#   MemoryMax= / MemoryHigh=
#     A depsolve of this size has no stable ceiling to pick, and the failure
#     mode of guessing low is an upgrade that cannot complete on a system that
#     most needs one. scx.service can carry MemoryMax because a killed
#     scheduler costs nothing; a killed upgrade costs the thing it was fixing.
#
# What none of this touches is the syncfs() storm during the layer pull -- that
# I/O is issued by the btrfs-transaction kthread in the root cgroup and is
# outside cgroup control by construction. See the note in
# user.slice.d/10-pulsar-io-latency.conf.
[Service]
CPUWeight=50
