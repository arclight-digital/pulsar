# Everything is built here. The machine running Pulsar builds nothing and is
# configured with nothing: it pulls a signed image and bootc's own timer
# stages it. Both variants are pushed to ghcr with provenance attestations.
#
# This workflow holds the Secure Boot signing key (secrets AKMODS_PRIV /
# AKMODS_CERT, base64 of the DER key and cert that are ALREADY enrolled in
# this machine's MOK). That is a deliberate trade: the base image already
# comes from here, so a compromise of this repo owns the target machine with
# or without the signing key. The key is written to a tmpfs-backed path,
# passed to podman as a build secret, and shredded in an always() step.
#
# The committed public cert at system_files/etc/pki/pulsar/MOK.der must match
# AKMODS_CERT. Phase 5 of Containerfile.nvidia fails the build if it does not,
# which is what stops a stale cert from black-screening the machine.
name: build

on:
  push:
    branches: [main]
    # the one-pager has its own pipeline (site.yml); docs and site edits
    # must never cost a dual-image OS build
    paths-ignore:
      - 'site/**'
      - '.github/workflows/site.yml'
      - '**.md'
      - 'LICENSE'
  schedule:
    # Nightly, ahead of the machine's 04:00 local staging window.
    - cron: '30 8 * * *'
  workflow_dispatch:

# queue image builds instead of racing pushes to :latest from parallel runs
concurrency:
  group: build
  cancel-in-progress: false

env:
  FEDORA_VERSION: "44"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      # contents: write, not read -- the nightly commits site/changelog.json
      # and its rendered fragment back to the repo. build.yml's paths-ignore
      # covers site/**, so that commit cannot retrigger an image build; it
      # only wakes Cloudflare's git integration, which redeploys the page.
      contents: write
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4

      # Both images together are ~17 GB plus intermediate layers, well past
      # what a stock runner has free on /. The temp disk has room to spare.
      - name: Put container storage on the temp disk
        run: |
          sudo mkdir -p /mnt/podman && sudo chown "$(id -u):$(id -g)" /mnt/podman
          printf '[storage]\ndriver = "overlay"\ngraphroot = "/mnt/podman"\nrunroot = "/tmp/podman-run"\n' \
            > /tmp/storage.conf
          echo "CONTAINERS_STORAGE_CONF=/tmp/storage.conf" >> "$GITHUB_ENV"
          df -h / /mnt

      # ghcr namespaces must be lowercase; repository_owner may not be.
      - name: Resolve image names
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          echo "IMAGE=ghcr.io/${OWNER,,}/pulsar" >> "$GITHUB_ENV"
          echo "IMAGE_NVIDIA=ghcr.io/${OWNER,,}/pulsar-nvidia" >> "$GITHUB_ENV"
          # immutable per-build tag alongside the moving :44/:latest, matching
          # Fedora's own version style (44.20260805). This is what makes
          # "pin to last Tuesday's build" and clean rollbacks possible.
          echo "DATETAG=${FEDORA_VERSION}.$(date -u +%Y%m%d)" >> "$GITHUB_ENV"

      # Both logins are needed: podman writes auth to
      # $XDG_RUNTIME_DIR/containers/auth.json for the build/push steps, but
      # attest-build-provenance's push-to-registry reads ~/.docker/config.json
      # and fails with "No credentials found for registry ghcr.io" without
      # the docker login.
      - name: Log in to ghcr.io
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u "${{ github.actor }}" --password-stdin
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      # Tooling for the SBOM/signing steps at the end. Pinned to major tags
      # so a compromised point release cannot silently change what signs.
      # No syft: see the SBOM step for why it was removed.
      - uses: oras-project/setup-oras@v1
      - uses: sigstore/cosign-installer@v3

      # MUST run before the push below overwrites :latest. This is the image
      # the changelog diffs against; once :latest moves, the previous build is
      # only reachable by a digest nobody recorded.
      #
      # Empty on the very first run, when :latest does not exist yet. That is
      # not an error -- it is the baseline case, handled downstream.
      - name: Record the outgoing :latest digest
        run: |
          prev="$(oras resolve "${IMAGE}:latest" 2>/dev/null || true)"
          echo "PREV_DIGEST=${prev}" >> "$GITHUB_ENV"
          echo "previous :latest digest: ${prev:-<none, first build>}"

      # The wallpapers are rendered from assets/shaders/pulsar.frag, not
      # committed -- they are 4K PNGs and fully reproducible from the shader.
      # This has to happen BEFORE the build, because the Containerfile just
      # COPYs system_files/ and the build container has no GL stack.
      # llvmpipe does the rasterising; no GPU on a runner.
      - name: Render wallpapers
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            libegl1 libgl1 libgl-dev libgl1-mesa-dri libglvnd0
          pip install --quiet moderngl numpy pillow
          python3 scripts/render-wallpapers.py

      - name: Build vanilla
        run: |
          podman build --pull=newer \
            --file Containerfile \
            --build-arg FEDORA_VERSION="${FEDORA_VERSION}" \
            -t "${IMAGE}:${FEDORA_VERSION}" -t "${IMAGE}:latest" -t "${IMAGE}:${DATETAG}" .

      - name: Push vanilla
        id: push_vanilla
        run: |
          podman push --digestfile /tmp/digest-vanilla "${IMAGE}:${FEDORA_VERSION}"
          podman push "${IMAGE}:latest"
          podman push "${IMAGE}:${DATETAG}"
          echo "digest=$(cat /tmp/digest-vanilla)" >> "$GITHUB_OUTPUT"

      # /dev/shm is tmpfs: the key never touches the runner's disk. The
      # nvidia base resolves from local storage, so this layers on the exact
      # image just pushed rather than racing the registry for it.
      - name: Build nvidia
        env:
          AKMODS_PRIV: ${{ secrets.AKMODS_PRIV }}
          AKMODS_CERT: ${{ secrets.AKMODS_CERT }}
        run: |
          if [ -z "$AKMODS_PRIV" ] || [ -z "$AKMODS_CERT" ]; then
            echo "::error::AKMODS_PRIV/AKMODS_CERT secrets are not set; cannot sign the nvidia kmod."
            exit 1
          fi
          install -d -m 0700 /dev/shm/keys
          umask 077
          printf '%s' "$AKMODS_PRIV" | base64 -d > /dev/shm/keys/priv
          printf '%s' "$AKMODS_CERT" | base64 -d > /dev/shm/keys/cert
          podman build \
            --file Containerfile.nvidia \
            --build-arg FEDORA_VERSION="${FEDORA_VERSION}" \
            --build-arg BASE_IMAGE="${IMAGE}" \
            --secret id=akmods_priv,src=/dev/shm/keys/priv \
            --secret id=akmods_cert,src=/dev/shm/keys/cert \
            -t "${IMAGE_NVIDIA}:${FEDORA_VERSION}" -t "${IMAGE_NVIDIA}:latest" \
            -t "${IMAGE_NVIDIA}:${DATETAG}" .

      - name: Destroy the key material
        if: always()
        run: |
          shred -u /dev/shm/keys/* 2>/dev/null || true
          rm -rf /dev/shm/keys

      - name: Push nvidia
        id: push_nvidia
        run: |
          podman push --digestfile /tmp/digest-nvidia "${IMAGE_NVIDIA}:${FEDORA_VERSION}"
          podman push "${IMAGE_NVIDIA}:latest"
          podman push "${IMAGE_NVIDIA}:${DATETAG}"
          echo "digest=$(cat /tmp/digest-nvidia)" >> "$GITHUB_OUTPUT"

      - name: Attest vanilla
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push_vanilla.outputs.digest }}
          push-to-registry: true

      - name: Attest nvidia
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.IMAGE_NVIDIA }}
          subject-digest: ${{ steps.push_nvidia.outputs.digest }}
          push-to-registry: true

      # =====================================================================
      # Supply chain: what is IN the image, and what changed since last night.
      #
      # The attestation above proves WHERE an image came from. An SBOM proves
      # WHAT IS IN IT. Both are needed before "nightly image you can inspect"
      # means anything -- provenance without contents just tells you who built
      # the blob you still cannot see into.
      #
      # SBOMs are scanned from the REGISTRY by digest, not from local storage:
      # that scans the exact bytes that were pushed, so the SBOM cannot
      # describe an image that differs from the one users pull.
      # =====================================================================
      # This used syft and could not work. syft scans an IMAGE by squashing
      # and indexing every layer, which on this image needs more than the
      # 16GB a standard runner has. That is measured, not inferred: the first
      # run here died on signal 15 after 6m41s, and reproducing it locally
      # under a 16GB cgroup cap got the OOM killer to log 16.67GB with stock
      # settings, 16.74GB with file analysis off, and 16.74GB with only the
      # RPM cataloger selected. The figure barely moves because the cost is
      # the layer indexing, before any cataloger runs -- no syft flag avoids
      # it, and disk was never the problem (145GB, 60% free).
      #
      # scripts/rpm-sbom.sh reads the RPM database the image already carries
      # and produces the SAME 1790 packages in 0.49s and 52MB. That equality
      # was checked against syft's own rpm-db cataloger on this image, which
      # is what makes dropping syft a simplification rather than a downgrade.
      - name: Generate SBOMs
        run: |
          set -euo pipefail
          ./scripts/rpm-sbom.sh "${IMAGE}:${FEDORA_VERSION}"        > sbom-vanilla.spdx.json
          ./scripts/rpm-sbom.sh "${IMAGE_NVIDIA}:${FEDORA_VERSION}" > sbom-nvidia.spdx.json
          for f in sbom-vanilla sbom-nvidia; do
            n=$(jq '[.packages[] | select(.versionInfo)] | length' "${f}.spdx.json")
            echo "${f}: ${n} packages"
            [ "$n" -gt 100 ] || { echo "::error::${f} has only ${n} packages; the SBOM is not usable"; exit 1; }
          done
          # The nvidia image derives from vanilla, so it can never legitimately
          # carry fewer packages. If it does, the wrong image was inspected.
          v=$(jq '.packages | length' sbom-vanilla.spdx.json)
          n=$(jq '.packages | length' sbom-nvidia.spdx.json)
          [ "$n" -ge "$v" ] || { echo "::error::nvidia (${n}) has fewer packages than vanilla (${v})"; exit 1; }

      # Attached to the image itself, so the SBOM travels with the thing it
      # describes and is fetchable by anyone with `oras discover`. R2 gets a
      # copy below, but the registry copy is the authoritative one.
      - name: Attach SBOMs as OCI referrers
        run: |
          oras attach --artifact-type application/spdx+json \
            "${IMAGE}@${{ steps.push_vanilla.outputs.digest }}" \
            sbom-vanilla.spdx.json:application/spdx+json
          oras attach --artifact-type application/spdx+json \
            "${IMAGE_NVIDIA}@${{ steps.push_nvidia.outputs.digest }}" \
            sbom-nvidia.spdx.json:application/spdx+json

      # The diff baseline comes from R2's stable key, NOT from discovering the
      # previous image's referrer. `oras discover` has changed its JSON shape
      # between releases (manifests[] vs referrers[], --output vs --format),
      # and a changelog that silently empties itself when a tool updates is
      # worse than no changelog. A fixed R2 key cannot drift like that.
      - name: Build the changelog against last night's SBOM
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          # AWS CLI v2 sends checksum headers R2 has historically rejected.
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          FROM_REF: ${{ env.IMAGE }}@${{ env.PREV_DIGEST }}
          TO_REF: ${{ env.IMAGE }}@${{ steps.push_vanilla.outputs.digest }}
          TO_DIGEST: ${{ steps.push_vanilla.outputs.digest }}
          FROM_DIGEST: ${{ env.PREV_DIGEST }}
        run: |
          set -euo pipefail
          baseline=false
          aws s3 cp "s3://${R2_BUCKET}/pulsar/sbom/vanilla-latest.spdx.json" prev.spdx.json \
            --endpoint-url "${R2_ENDPOINT}" 2>/dev/null || baseline=true

          if [ "$baseline" = true ]; then
            echo "no previous SBOM in R2 -- emitting a baseline changelog"
            jq -n --arg g "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
                  --arg to "${IMAGE}@${{ steps.push_vanilla.outputs.digest }}" '{
              generated: $g, baseline: true,
              from: {ref: "", digest: ""}, to: {ref: $to, digest: ""},
              summary: {added:0, removed:0, upgraded:0, downgraded:0, changed:0},
              added: [], removed: [], changed: []
            }' > changelog.json
          else
            # Runs inside Fedora on purpose: the direction of a version change
            # is decided by rpmdev-vercmp, which implements real RPM ordering
            # (epochs, tildes, carets). GNU sort -V gets those wrong, and an
            # "upgraded" label that is actually a downgrade is a lie.
            podman run --rm -v "${PWD}":/w:z -w /w \
              -e FROM_REF -e TO_REF -e FROM_DIGEST -e TO_DIGEST \
              "registry.fedoraproject.org/fedora:${FEDORA_VERSION}" \
              bash -c 'dnf5 -y install jq rpmdevtools >/dev/null 2>&1 &&
                       ./scripts/sbom-changelog.sh prev.spdx.json sbom-vanilla.spdx.json' \
              > changelog.json
          fi
          jq '.summary' changelog.json

      - name: Publish SBOMs and changelog to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          R2_BUCKET: ${{ vars.R2_BUCKET }}
        run: |
          set -euo pipefail
          up() { aws s3 cp "$1" "s3://${R2_BUCKET}/$2" --endpoint-url "${R2_ENDPOINT}"; }
          # Immutable, per-build copies first...
          up sbom-vanilla.spdx.json "pulsar/sbom/${DATETAG}-vanilla.spdx.json"
          up sbom-nvidia.spdx.json  "pulsar/sbom/${DATETAG}-nvidia.spdx.json"
          up changelog.json         "pulsar/changelog/${DATETAG}.json"
          # ...then the moving pointers. vanilla-latest.spdx.json is the key
          # the NEXT nightly diffs against, so it is written last: if anything
          # above failed, the baseline still describes a real published image.
          up changelog.json         "pulsar/changelog/latest.json"
          up sbom-nvidia.spdx.json  "pulsar/sbom/nvidia-latest.spdx.json"
          up sbom-vanilla.spdx.json "pulsar/sbom/vanilla-latest.spdx.json"

      # Renders here, in Actions, where jq exists -- NOT in site/build.sh,
      # which Cloudflare runs and which stays dependency-free on purpose.
      #
      # This commit touches only site/, which build.yml's paths-ignore
      # excludes, so it cannot retrigger an image build. It does wake
      # Cloudflare's git integration, which is exactly the point.
      - name: Render and commit the site changelog
        run: |
          set -euo pipefail
          cp changelog.json site/changelog.json
          ./scripts/render-changelog.sh changelog.json > site/changelog.html
          if git diff --quiet -- site/changelog.json site/changelog.html; then
            echo "changelog unchanged since last build; nothing to commit"
            exit 0
          fi
          git config user.name  "pulsar-ci"
          git config user.email "ci@arclight.build"
          git add site/changelog.json site/changelog.html
          git commit -m "site: package changelog for ${DATETAG}"
          # Rebase rather than force: a human push that landed while the image
          # was building must not be discarded by the nightly.
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
