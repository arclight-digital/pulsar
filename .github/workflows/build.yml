# Everything is built here. The machine running Pulsar builds nothing and is
# configured with nothing: it pulls a published image and stages it as a
# normal update. Both variants are pushed to ghcr with provenance
# attestations.
#
# This workflow no longer holds the Secure Boot signing key. It holds a
# bearer token (PULSAR_SIGNER_TOKEN) for the signer host, which returns a
# signature per module and never hands over the key. A stolen token buys
# signatures until it is revoked; a stolen key costs a MOK re-enrolment at
# boot, physically, on every machine running Pulsar. The two are not the
# same kind of loss, which is the whole reason for the split.
#
# The signer must be reachable from wherever this runs. On the build host it
# sits on a private VPC; from a hosted runner it is whatever
# PULSAR_SIGNER_URL points at. If it is unset or unreachable the build fails
# rather than shipping an unsigned kmod -- a fail-closed choice, because the
# macro that drives module signing SKIPS SILENTLY when its inputs are
# missing (see Containerfile.nvidia phase 3).
#
# The committed public cert at system_files/etc/pki/pulsar/MOK.der must match
# the signer's key. Phase 5 of Containerfile.nvidia fails the build if it does
# not, which is what stops a stale cert from black-screening the machine --
# and it stays meaningful only because the build signs with the cert fetched
# from the signer rather than the committed one.
#
# The image pipeline itself lives in scripts/build.sh; this file supplies the
# runner-specific parts (credentials, versioning, attestation, SBOMs) and
# calls it.
name: build

on:
  push:
    branches: [main]
    # the one-pager has its own pipeline (site.yml); docs and site edits
    # must never cost a dual-image OS build
    paths-ignore:
      - 'site/**'
      - '.github/workflows/site.yml'
      # the og-card renderer is a site tool that happens to live in scripts/;
      # the rest of that directory is genuinely image input and must trigger
      - 'scripts/render-og.py'
      # ISOs are built FROM a published image, never into one, so iso.yml
      # cannot change what this workflow produces.
      - '.github/workflows/iso.yml'
      - '**.md'
      - 'LICENSE'
  schedule:
    # Nightly, so a fresh build is waiting when the machine checks for updates.
    - cron: '30 8 * * *'
  workflow_dispatch:

# queue image builds instead of racing pushes to :latest from parallel runs
concurrency:
  group: build
  cancel-in-progress: false

env:
  FEDORA_VERSION: "44"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      # contents: write, not read -- the nightly commits site/changelog.json
      # and its rendered fragment back to the repo. build.yml's paths-ignore
      # covers site/**, so that commit cannot retrigger an image build; it
      # only wakes Cloudflare's git integration, which redeploys the page.
      contents: write
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7

      # Both images together are ~17 GB plus intermediate layers, well past
      # what a stock runner has free on /. The temp disk has room to spare --
      # but it gets used at /var/mnt, not /mnt, and that distinction is the
      # whole ballgame.
      #
      # The containers-storage library RESOLVES the configured graphroot
      # through symlinks before comparing it to the path recorded in the
      # store's database, and refuses the store on a mismatch. Previously the
      # config said /mnt/podman while the mount was at /var/mnt/podman, which
      # worked only because /mnt is a symlink to var/mnt inside the image and
      # both sides happened to land on the same resolved path. That is a lot
      # of coincidence to keep a build honest, on a step whose failure mode is
      # not an error: when --from cannot read the store it PULLS the name from
      # the registry instead of stopping, and a registry-shaped name succeeds
      # at fetching something -- last night's image, chunked and pushed as
      # though it were this build.
      #
      # Bind-mounting at /var/mnt removes the coincidence: the database
      # records /var/mnt/podman, the config says /var/mnt/podman, and inside
      # the image it resolves to itself with no symlink in the path.
      #
      # This is hardening, not a diagnosis. scripts/rechunk-selftest.sh
      # verifies locally that a mismatch IS refused loudly and that a missing
      # image IS pulled silently; it has not reproduced the stale content on
      # a runner, and the assertion after the rechunk is what actually proves
      # each build shipped its own bytes.
      - name: Put container storage on the temp disk
        run: |
          sudo mkdir -p /var/mnt
          sudo mount --bind /mnt /var/mnt
          sudo mkdir -p /var/mnt/podman && sudo chown "$(id -u):$(id -g)" /var/mnt/podman
          printf '[storage]\ndriver = "overlay"\ngraphroot = "/var/mnt/podman"\nrunroot = "/tmp/podman-run"\n' \
            > /tmp/storage.conf
          echo "CONTAINERS_STORAGE_CONF=/tmp/storage.conf" >> "$GITHUB_ENV"
          df -h / /var/mnt

      # ghcr namespaces must be lowercase; repository_owner may not be.
      - name: Resolve image names
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          echo "IMAGE=ghcr.io/${OWNER,,}/pulsar" >> "$GITHUB_ENV"
          echo "IMAGE_NVIDIA=ghcr.io/${OWNER,,}/pulsar-nvidia" >> "$GITHUB_ENV"

      # Both logins are needed: podman writes auth to
      # $XDG_RUNTIME_DIR/containers/auth.json for the build/push steps, but
      # attest-build-provenance's push-to-registry reads ~/.docker/config.json
      # and fails with "No credentials found for registry ghcr.io" without
      # the docker login.
      - name: Log in to ghcr.io
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u "${{ github.actor }}" --password-stdin
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      # Tooling for the SBOM/signing steps at the end. Pinned to major tags
      # so a compromised point release cannot silently change what signs.
      # No syft: see the SBOM step for why it was removed.
      - uses: oras-project/setup-oras@v2
      - uses: sigstore/cosign-installer@v3

      # Per-build version, Fedora's own shape: <release>.<YYYYMMDD>.<n>.
      #
      # The n is not decoration. This tag was previously just 44.<date> and was
      # documented as "immutable per-build", which it was not: two pushes on
      # one day both computed the same tag and the second silently replaced the
      # first. That happened -- twice on 2026-08-05 alone -- so "pin to last
      # Tuesday's build" was pinning to whatever landed last that Tuesday.
      #
      # n is derived from what the registry already holds rather than from a
      # run counter, so it stays correct across re-runs and manual dispatches.
      # An unreachable registry falls back to .0 rather than failing the build,
      # which is the same tag the old scheme produced.
      - name: Compute the build version
        run: |
          set -euo pipefail
          tag="$(scripts/next-version.sh --fedora "${FEDORA_VERSION}" "${IMAGE}")"
          echo "DATETAG=${tag}" >> "$GITHUB_ENV"
          echo "this build is ${tag}"

      # MUST run before the push below overwrites :latest. This is the image
      # the changelog diffs against; once :latest moves, the previous build is
      # only reachable by a digest nobody recorded.
      #
      # Empty on the very first run, when :latest does not exist yet. That is
      # not an error -- it is the baseline case, handled downstream.
      - name: Record the outgoing :latest digest
        run: |
          prev="$(oras resolve "${IMAGE}:latest" 2>/dev/null || true)"
          echo "PREV_DIGEST=${prev}" >> "$GITHUB_ENV"
          echo "previous :latest digest: ${prev:-<none, first build>}"
      # The wallpapers are rendered from assets/shaders/pulsar.frag, not
      # committed -- they are 4K PNGs and fully reproducible from the shader.
      # This has to happen BEFORE the build, because the Containerfile just
      # COPYs system_files/ and the build container has no GL stack.
      # llvmpipe does the rasterising; no GPU on a runner. scripts/build.sh
      # runs the renderer itself; this only supplies the toolchain, which is
      # the one part that is genuinely runner-specific.
      - name: Install the wallpaper render toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            libegl1 libgl1 libgl-dev libgl1-mesa-dri libglvnd0
          pip install --quiet moderngl numpy pillow

      # =====================================================================
      # Everything from here to the push lives in scripts/build.sh, and this
      # workflow calls it rather than reimplementing it.
      #
      # It used to be inline, and the local script next to it did something
      # subtly different -- no version stamp, no wallpapers, no rechunk, and
      # image names shaped differently enough that the bug which shipped
      # stale content for weeks could not reproduce locally at all. One
      # implementation, called from both places, is what stops that
      # recurring. What the script does and why is documented there; the
      # short version is: build, re-slice into package-grouped layers, assert
      # the chunked image holds THIS build's content, check that the round
      # trip did not move any mode or owner, then push.
      #
      # --push implies --verify implies --rechunk: nothing ships without
      # having been checked.
      # =====================================================================
      - name: Build, rechunk and push vanilla
        id: push_vanilla
        run: |
          set -euo pipefail
          scripts/build.sh \
            --variant vanilla \
            --version "${DATETAG}" \
            --image "${IMAGE}" \
            --work /var/mnt/oci \
            --push
          echo "digest=$(cat /var/mnt/oci/digest-vanilla)" >> "$GITHUB_OUTPUT"

      # The nvidia variant needs a signature, and the key is not here. It
      # lives on the signer host; the build sends each module out and attaches
      # what comes back (scripts/sign-file-oracle). This runner therefore
      # holds a bearer token and nothing else -- there is no key material to
      # shred afterwards, which is why the step that used to do that is gone.
      #
      # A hosted runner can only do this if the signer is reachable from it.
      # On the build host the signer sits on a private VPC; from here it is
      # whatever PULSAR_SIGNER_URL points at, and the build fails closed if
      # that is unset or unreachable rather than shipping an unsigned kmod.
      - name: Build, rechunk and push nvidia
        id: push_nvidia
        env:
          SIGNER_TOKEN: ${{ secrets.PULSAR_SIGNER_TOKEN }}
          SIGNER_URL: ${{ secrets.PULSAR_SIGNER_URL }}
        run: |
          set -euo pipefail
          if [ -z "${SIGNER_TOKEN}" ] || [ -z "${SIGNER_URL}" ]; then
            echo "::error::PULSAR_SIGNER_TOKEN/PULSAR_SIGNER_URL are not set;"
            echo "::error::the nvidia kmod cannot be signed from this runner."
            exit 1
          fi
          install -d -m 0700 /dev/shm/signer
          umask 077
          printf '%s' "${SIGNER_TOKEN}" > /dev/shm/signer/token
          scripts/build.sh \
            --variant nvidia \
            --version "${DATETAG}" \
            --image "${IMAGE}" \
            --image-nvidia "${IMAGE_NVIDIA}" \
            --signer-url "${SIGNER_URL}" \
            --signer-token-file /dev/shm/signer/token \
            --work /var/mnt/oci \
            --no-wallpapers \
            --push
          echo "digest=$(cat /var/mnt/oci/digest-nvidia)" >> "$GITHUB_OUTPUT"

      - name: Destroy the signer token
        if: always()
        run: |
          shred -u /dev/shm/signer/* 2>/dev/null || true
          rm -rf /dev/shm/signer


      - name: Attest vanilla
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push_vanilla.outputs.digest }}
          push-to-registry: true

      - name: Attest nvidia
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.IMAGE_NVIDIA }}
          subject-digest: ${{ steps.push_nvidia.outputs.digest }}
          push-to-registry: true

      # =====================================================================
      # Supply chain: what is IN the image, and what changed since last night.
      #
      # The attestation above proves WHERE an image came from. An SBOM proves
      # WHAT IS IN IT. Both are needed before "nightly image you can inspect"
      # means anything -- provenance without contents just tells you who built
      # the blob you still cannot see into.
      #
      # SBOMs are scanned from the REGISTRY by digest, not from local storage:
      # that scans the exact bytes that were pushed, so the SBOM cannot
      # describe an image that differs from the one users pull.
      # =====================================================================
      # This used syft and could not work. syft scans an IMAGE by squashing
      # and indexing every layer, which on this image needs more than the
      # 16GB a standard runner has. That is measured, not inferred: the first
      # run here died on signal 15 after 6m41s, and reproducing it locally
      # under a 16GB cgroup cap got the OOM killer to log 16.67GB with stock
      # settings, 16.74GB with file analysis off, and 16.74GB with only the
      # RPM cataloger selected. The figure barely moves because the cost is
      # the layer indexing, before any cataloger runs -- no syft flag avoids
      # it, and disk was never the problem (145GB, 60% free).
      #
      # scripts/rpm-sbom.sh reads the RPM database the image already carries
      # and produces the SAME 1790 packages in 0.49s and 52MB. That equality
      # was checked against syft's own rpm-db cataloger on this image, which
      # is what makes dropping syft a simplification rather than a downgrade.
      - name: Generate SBOMs
        run: |
          set -euo pipefail
          ./scripts/rpm-sbom.sh "${IMAGE}:${FEDORA_VERSION}"        > sbom-vanilla.spdx.json
          ./scripts/rpm-sbom.sh "${IMAGE_NVIDIA}:${FEDORA_VERSION}" > sbom-nvidia.spdx.json
          for f in sbom-vanilla sbom-nvidia; do
            n=$(jq '[.packages[] | select(.versionInfo)] | length' "${f}.spdx.json")
            echo "${f}: ${n} packages"
            [ "$n" -gt 100 ] || { echo "::error::${f} has only ${n} packages; the SBOM is not usable"; exit 1; }
          done
          # The nvidia image derives from vanilla, so it can never legitimately
          # carry fewer packages. If it does, the wrong image was inspected.
          v=$(jq '.packages | length' sbom-vanilla.spdx.json)
          n=$(jq '.packages | length' sbom-nvidia.spdx.json)
          [ "$n" -ge "$v" ] || { echo "::error::nvidia (${n}) has fewer packages than vanilla (${v})"; exit 1; }

      # Attached to the image itself, so the SBOM travels with the thing it
      # describes and is fetchable by anyone with `oras discover`. R2 gets a
      # copy below, but the registry copy is the authoritative one.
      - name: Attach SBOMs as OCI referrers
        run: |
          oras attach --artifact-type application/spdx+json \
            "${IMAGE}@${{ steps.push_vanilla.outputs.digest }}" \
            sbom-vanilla.spdx.json:application/spdx+json
          oras attach --artifact-type application/spdx+json \
            "${IMAGE_NVIDIA}@${{ steps.push_nvidia.outputs.digest }}" \
            sbom-nvidia.spdx.json:application/spdx+json

      # The diff baseline comes from R2's stable key, NOT from discovering the
      # previous image's referrer. `oras discover` has changed its JSON shape
      # between releases (manifests[] vs referrers[], --output vs --format),
      # and a changelog that silently empties itself when a tool updates is
      # worse than no changelog. A fixed R2 key cannot drift like that.
      - name: Build the changelog against last night's SBOM
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          # AWS CLI v2 sends checksum headers R2 has historically rejected.
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          FROM_REF: ${{ env.IMAGE }}@${{ env.PREV_DIGEST }}
          TO_REF: ${{ env.IMAGE }}@${{ steps.push_vanilla.outputs.digest }}
          TO_DIGEST: ${{ steps.push_vanilla.outputs.digest }}
          FROM_DIGEST: ${{ env.PREV_DIGEST }}
        run: |
          set -euo pipefail
          baseline=false
          aws s3 cp "s3://${R2_BUCKET}/pulsar/sbom/vanilla-latest.spdx.json" prev.spdx.json \
            --endpoint-url "${R2_ENDPOINT}" 2>/dev/null || baseline=true

          if [ "$baseline" = true ]; then
            echo "no previous SBOM in R2 -- emitting a baseline changelog"
            jq -n --arg g "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
                  --arg to "${IMAGE}@${{ steps.push_vanilla.outputs.digest }}" '{
              generated: $g, baseline: true,
              from: {ref: "", digest: ""}, to: {ref: $to, digest: ""},
              summary: {added:0, removed:0, upgraded:0, downgraded:0, changed:0},
              added: [], removed: [], changed: []
            }' > changelog.json
          else
            # Runs inside Fedora on purpose: the direction of a version change
            # is decided by rpmdev-vercmp, which implements real RPM ordering
            # (epochs, tildes, carets). GNU sort -V gets those wrong, and an
            # "upgraded" label that is actually a downgrade is a lie.
            podman run --rm -v "${PWD}":/w:z -w /w \
              -e FROM_REF -e TO_REF -e FROM_DIGEST -e TO_DIGEST \
              "registry.fedoraproject.org/fedora:${FEDORA_VERSION}" \
              bash -c 'dnf5 -y install jq rpmdevtools >/dev/null 2>&1 &&
                       ./scripts/sbom-changelog.sh prev.spdx.json sbom-vanilla.spdx.json' \
              > changelog.json
          fi
          jq '.summary' changelog.json

      - name: Publish SBOMs and changelog to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          R2_BUCKET: ${{ vars.R2_BUCKET }}
        run: |
          set -euo pipefail
          up() { aws s3 cp "$1" "s3://${R2_BUCKET}/$2" --endpoint-url "${R2_ENDPOINT}"; }
          # Immutable, per-build copies first...
          up sbom-vanilla.spdx.json "pulsar/sbom/${DATETAG}-vanilla.spdx.json"
          up sbom-nvidia.spdx.json  "pulsar/sbom/${DATETAG}-nvidia.spdx.json"
          up changelog.json         "pulsar/changelog/${DATETAG}.json"
          # ...then the moving pointers. vanilla-latest.spdx.json is the key
          # the NEXT nightly diffs against, so it is written last: if anything
          # above failed, the baseline still describes a real published image.
          up changelog.json         "pulsar/changelog/latest.json"
          up sbom-nvidia.spdx.json  "pulsar/sbom/nvidia-latest.spdx.json"
          up sbom-vanilla.spdx.json "pulsar/sbom/vanilla-latest.spdx.json"

      # Renders here, in Actions, where jq exists -- NOT in site/build.sh,
      # which Cloudflare runs and which stays dependency-free on purpose.
      #
      # This commit touches only site/, which build.yml's paths-ignore
      # excludes, so it cannot retrigger an image build. It does wake
      # Cloudflare's git integration, which is exactly the point.
      - name: Render and commit the site changelog and manifest
        run: |
          set -euo pipefail

          # The manifest card on the page is a transcript of the image's own
          # baked manifest, extracted from the nvidia image just built --
          # never hand-written HTML wearing terminal chrome. Pulled out here,
          # once, because publish() below may run more than once and this is
          # the expensive part.
          podman run --rm "${IMAGE_NVIDIA}:${FEDORA_VERSION}" \
            cat /usr/share/pulsar/manifest.json > manifest.json

          # SYNC FIRST, THEN RENDER. This used to render against the checkout
          # and reconcile afterwards with `git pull --rebase`, which was wrong
          # twice over.
          #
          # The quiet failure: an image build takes fifteen minutes, so by the
          # time this step runs the checkout can be several commits stale --
          # INCLUDING the renderers themselves. Rendering with the stale copy
          # and rebasing means the nightly silently reverts whatever changed
          # about the output. A commit that dropped a row from
          # render-manifest.sh was undone exactly this way, and a rebase does
          # it without complaining.
          #
          # The loud one: these five files are wholly REGENERATED each run, so
          # a rebase is two full-file rewrites with no common hunk. It
          # conflicts whenever anything else has touched them -- which is
          # every time two builds overlap. There is nothing to rebase if the
          # commit is built on the tip to begin with.
          #
          # The generated inputs (changelog.json, manifest.json) sit at the
          # workspace root and are untracked, so the reset cannot take them.
          git config user.name  "pulsar-ci"
          git config user.email "ci@arclight.build"

          publish() {
            git fetch -q --depth=1 origin "${GITHUB_REF_NAME}" || return 1
            git reset -q --hard FETCH_HEAD || return 1

            cp changelog.json site/changelog.json                            || return 1
            ./scripts/render-changelog.sh changelog.json > site/changelog.html || return 1
            cp manifest.json site/manifest.json                              || return 1
            ./scripts/render-manifest.sh manifest.json > site/manifest.html  || return 1
            jq -r '.version // "nightly"' manifest.json > site/version.txt   || return 1

            # Compare CONTENT, not the file. Every build stamps fresh
            # timestamps and digests, so a byte comparison always differs and
            # would commit every single night even when nothing in the image
            # moved -- daily bot noise in a hand-written history.
            local norm mnorm new old new_mf old_mf
            norm='del(.generated, .from, .to)'
            new=$(jq -S "$norm" changelog.json)
            old=$(git show "HEAD:site/changelog.json" 2>/dev/null | jq -S "$norm" 2>/dev/null || echo "__none__")
            mnorm='del(.version, .built)'
            new_mf=$(jq -S "$mnorm" manifest.json)
            old_mf=$(git show "HEAD:site/manifest.json" 2>/dev/null | jq -S "$mnorm" 2>/dev/null || echo "__none__")
            if [ "$new" = "$old" ] && [ "$new_mf" = "$old_mf" ]; then
              echo "no package or manifest changes since the last commit; nothing to commit"
              return 2
            fi

            # Stage BEFORE testing. `git diff` ignores untracked files, so on
            # the first run -- when these files are not in the repo yet -- it
            # reported "unchanged" and skipped the commit, which is precisely
            # the run that had to make it. That is why site/changelog.json was
            # never committed.
            git add site/changelog.json site/changelog.html \
                    site/manifest.json site/manifest.html site/version.txt || return 1
            git commit -q -m "site: package changelog for ${DATETAG}" || return 1
            git push -q origin "HEAD:${GITHUB_REF_NAME}"
          }

          # A push can still lose a race with a commit that landed in the last
          # second. That is a retry, not a merge: resync and render again.
          for attempt in 1 2 3; do
            set +e; publish; rc=$?; set -e
            case "$rc" in
              0) echo "site commit published (attempt ${attempt})"; exit 0 ;;
              2) exit 0 ;;
            esac
            echo "could not publish (attempt ${attempt}); resyncing" >&2
            sleep $((attempt * 5))
          done
          echo "gave up publishing the site commit after 3 attempts" >&2
          exit 1
