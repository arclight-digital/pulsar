# Transparent hugepage defrag policy. A sysfs knob, not a sysctl, which is the
# only reason this file exists rather than another line in
# /usr/lib/sysctl.d/60-pulsar-gaming.conf.
#
# THE STALL THIS REMOVES. Fedora ships enabled=madvise / defrag=madvise, and
# the second of those is the expensive one. Under defrag=madvise, a thread that
# calls madvise(MADV_HUGEPAGE) and then faults gets SYNCHRONOUS compaction: the
# faulting thread itself runs the compaction scanner, migrating pages around
# until a 2MB block exists or the scan gives up. It is not a slow allocation,
# it is the game's own thread doing memory-management work mid-frame, for as
# long as that takes.
#
# wine and Proton's allocators do exactly this -- MADV_HUGEPAGE over large
# heap regions is how they get hugepage backing for game address space -- so
# the path is not hypothetical here, it is the common case for everything this
# image exists to run.
#
# defer+madvise keeps the hugepage and moves the work: the fault takes a 4K
# page immediately and wakes kswapd/kcompactd to build the hugepage in the
# background, and khugepaged collapses the region into it afterwards. Same end
# state, same MADV_HUGEPAGE semantics honoured, none of it on the frame's
# critical path.
#
# NOT set to `always`. enabled= stays at Fedora's madvise, so this governs the
# behaviour of processes that ASKED for hugepages and changes nothing for
# those that did not. Turning THP on globally is a different and much larger
# decision, and one nothing here needs.
#
# Type w, not w+: a single write rather than an append, and -- the reason it
# matters here -- `w` skips a path that does not exist instead of failing. A
# future kernel that renames or retires this knob costs a silent no-op, not a
# boot-time error on every machine that pulled the image. A tuning drop-in
# should never be the loudest thing about an upgrade.
w /sys/kernel/mm/transparent_hugepage/defrag - - - - defer+madvise
