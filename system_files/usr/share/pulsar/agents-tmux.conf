# tmux for coding agents: read only by the agents' own server
# (tmux -L pulsar-agents, started by `pulsar agent run <name> --tmux <session>`).
# Your own tmux, and its ~/.config/tmux/tmux.conf, never see this file, and
# this server never reads that one. Additions go in
# ~/.config/pulsar/agents-tmux.conf, read last; source your own config from
# there if you want its key bindings here too.
#
# Shipped with the image, so it updates with it. Read when the server starts:
# `pulsar agent sessions` lists what is running.

# An agent's TUI reads Escape as "stop": tmux's default 500 ms wait for a
# following key makes every Escape lag.
set -s escape-time 10

# Shift+Enter, Ctrl+Enter and the like reach the agent as distinct keys
# (a newline in the prompt rather than "send").
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'

# Focus in/out, which agents use to know when to notify.
set -s focus-events on

# Terminal escape sequences an agent prints for the outer terminal
# (notifications, hyperlinks, images) get through.
set -g allow-passthrough on

# A long conversation scrolls past tmux's default 2000 lines in minutes.
set -g history-limit 100000

source-file -q ~/.config/pulsar/agents-tmux.conf
