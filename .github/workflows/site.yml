# Deploys site/ to Cloudflare Workers (assets-only Worker "pulsar-site").
# Completely separate pipeline from build.yml: site edits must never cost a
# 15-minute dual-image OS build, and image changes redeploy the site only
# when shared brand assets moved.
#
# Needs two repo secrets: CLOUDFLARE_API_TOKEN (Workers Scripts: Edit scope)
# and CLOUDFLARE_ACCOUNT_ID. Fails loudly when they are missing rather than
# pretending to deploy.
name: site

on:
  push:
    branches: [main]
    paths: ['site/**', 'assets/**', '.github/workflows/site.yml']
  workflow_dispatch:

permissions:
  contents: read

# queue deploys; never let two runs race the same Worker
concurrency:
  group: site-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble site
        run: ./site/build.sh
      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN/CLOUDFLARE_ACCOUNT_ID secrets are not set; cannot deploy the site."
            exit 1
          fi
          npx wrangler@4 deploy --config site/wrangler.jsonc
