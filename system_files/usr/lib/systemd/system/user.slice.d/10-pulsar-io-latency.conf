# Protect the session's I/O from whatever the system is doing behind it.
#
# THE PROBLEM THIS REPLACES. uresourced already tries to do this: it sets
# io.weight=500 on user-1000.slice against system.slice's default 100, a 5:1
# advantage. On this image that advantage is never enforced, because io.weight
# is only honoured by bfq or blk-iocost, and we ship neither --
# /sys/block/*/queue/scheduler reads [none] on NVMe, and io.cost.qos and
# io.cost.model exist but are empty. The knob is set, looks set, and does
# nothing. IOSchedulingClass= and ionice are inert here for exactly the same
# reason, so anything reaching for those to fix this will appear to work and
# will not.
#
# WHY io.latency AND NOT iocost. IODeviceLatencyTargetSec maps to io.latency,
# which lives in blk-cgroup core and needs no I/O scheduler and no device
# model -- it works with scheduler=none as shipped. blk-iocost is the more
# capable answer, but it needs per-device QoS and cost-model parameters
# obtained by benchmarking the actual drive. This image ships to hardware
# nobody has measured, and wrong iocost parameters are worse than no iocost at
# all, so it is the wrong bet for a distro image.
#
# WHY THIS WORKS AT ALL. cgroup writeback is implemented by ext2, ext4 and
# btrfs only; the root filesystem here is btrfs, and io.stat confirms real
# per-cgroup attribution rather than everything landing in the root cgroup.
# The mechanism is sound. Only the enforcement layer was missing.
#
# The target is set on the cgroup being PROTECTED. io.latency works against
# peers: when user.slice misses its target, siblings -- system.slice, where
# rpm-ostreed and every other daemon lives -- get throttled until it stops
# missing. Setting it on system.slice instead would protect the wrong side.
#
# The path is "/" rather than a device node deliberately. systemd takes either
# and resolves a non-device path to the block device backing that filesystem,
# so this follows the root filesystem to whatever drive an install actually
# landed on. /dev/nvme1n1 parses fine and is correct on exactly one machine.
#
# WHAT THIS DOES NOT FIX, so nobody re-litigates it later: it does nothing
# about syncfs(). An rpm-ostree upgrade issues whole-filesystem syncs -- 28 of
# them in 65s on 2026-08-14, 24 during the 23-layer pull, roughly one per
# layer -- and on btrfs each forces a full transaction commit spanning /,
# /var and /home alike. That commit I/O is issued by the btrfs-transaction
# kthread in the ROOT cgroup, which is outside cgroup control by construction:
# no io.latency target, no weight and no scheduler can reach it. Its own
# measured self-time was 1.42s; the damage is other writers stalling as they
# wait to join a transaction, which cannot be attributed back after the fact.
# The only thing that addresses that is not running an unattended upgrade at
# all -- see download-updates in zz0-pulsar.gschema.override. This drop-in
# reduces the blast radius of an upgrade the user asked for; it does not make
# an unasked one safe.
[Slice]
IODeviceLatencyTargetSec=/ 50ms
