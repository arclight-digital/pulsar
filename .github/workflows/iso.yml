# Installable ISOs for both variants, checksummed and signed.
#
# Deliberately NOT part of build.yml. Two reasons, both practical:
#
#   Disk. bootc-image-builder has to pull a ~10GB image and write a multi-GB
#   ISO out of it. build.yml already carries ~17GB of images and moves podman
#   storage onto the temp disk to fit. Adding ISOs to that job runs it out of
#   space; a matrix here gives each variant a FRESH runner and a fresh disk.
#
#   Cadence. Images are worth rebuilding nightly because rebasing is cheap.
#   ISOs are for installs, which are rare -- publishing 8GB of installer every
#   night would burn bandwidth and R2 storage to no one's benefit.
#
# ISOs go to R2 rather than GitHub Releases: release assets cap at 2GB per
# file and a Silverblue-derived installer clears that comfortably.
name: iso

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to build ISOs from"
        required: false
        default: "latest"
      variant:
        description: "Which variant to build"
        required: false
        type: choice
        default: both
        options: [both, pulsar, pulsar-nvidia]
  schedule:
    # Weekly, Sunday, well clear of the nightly image build at 08:30.
    - cron: '0 11 * * 0'

concurrency:
  group: iso
  cancel-in-progress: false

env:
  FEDORA_VERSION: "44"
  # Pinned by digest, not :latest. The flag surface here is not stable -- the
  # `--local` flag this workflow was first written against no longer exists,
  # because bib stopped pulling images itself and reads local storage only.
  # A digest makes that kind of change a deliberate bump instead of a
  # workflow that breaks on a morning nobody touched it.
  BIB: quay.io/centos-bootc/bootc-image-builder@sha256:2b52843ea2bfda73b0a08d97e76b734393b1d3a804681b9fabb26723bd3a2f0b
  # The image lineage declares no default root filesystem: /usr/lib/bootc/install
  # is empty in fedora-silverblue, so bib exits with "no default root filesystem
  # type specified in container". btrfs matches what Silverblue's own installer
  # picks, so an ISO install lands on the same layout as a stock one.
  ROOTFS: btrfs

jobs:
  iso:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      # cosign keyless signing exchanges this for a Fulcio cert. No private
      # key exists to leak: the signature is bound to this workflow's identity
      # and logged in Rekor, which is the property we actually want.
      id-token: write
    strategy:
      # Independent runners, independent disks: one variant failing says
      # nothing about the other, so it must not cancel it.
      fail-fast: false
      matrix:
        # Empty on a schedule run, which correctly falls through to both.
        variant: ${{ fromJSON(
          github.event.inputs.variant == 'pulsar' && '["pulsar"]'
          || github.event.inputs.variant == 'pulsar-nvidia' && '["pulsar-nvidia"]'
          || '["pulsar","pulsar-nvidia"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: sigstore/cosign-installer@v3

      # Everything that touches multiple GB lives on /mnt: the runner's root
      # filesystem has ~20GB free, and one ISO build moves more than that
      # between the image, the osbuild store and the output.
      - name: Resolve names and put the big directories on /mnt
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          echo "IMAGE=ghcr.io/${OWNER,,}/${{ matrix.variant }}" >> "$GITHUB_ENV"
          echo "TAG=${{ github.event.inputs.tag || 'latest' }}" >> "$GITHUB_ENV"
          sudo mkdir -p /mnt/podman /mnt/iso /mnt/store /mnt/rpmmd
          sudo mkdir -p /var/lib/containers/storage
          sudo chown "$(id -u):$(id -g)" /mnt/iso
          # Bind-mount, NOT a graphroot setting in storage.conf. Podman records
          # its static dir inside the database, so a relocated graphroot makes
          # the nested podman inside bib refuse the store it was handed:
          #   database static dir "/mnt/podman/libpod" does not match our
          #   static dir "/var/lib/containers/storage/libpod"
          # Bind-mounting keeps the path identical on both sides while the
          # bytes still land on the big disk.
          sudo mount --bind /mnt/podman /var/lib/containers/storage
          findmnt -no SOURCE,TARGET,FSTYPE /var/lib/containers/storage
          df -h / /mnt

      - name: Log in to ghcr.io
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | sudo podman login ghcr.io -u "${{ github.actor }}" --password-stdin \
                --authfile /tmp/auth.json

      # bib no longer pulls images -- it reads local container storage and says
      # so explicitly if the image is absent. So the pull happens here, into the
      # graphroot that gets bind-mounted into the builder below.
      # ROOTFUL, because bib runs under sudo and reads this same store from
      # inside its own container: a rootless pull writes UID-shifted layers
      # the rootful builder cannot use.
      - name: Pull the image
        run: |
          sudo podman pull --authfile /tmp/auth.json "${IMAGE}:${TAG}"
          sudo podman image inspect "${IMAGE}:${TAG}" --format 'pulled {{.Id}} ({{.Size}} bytes)'

      # --privileged and the unconfined label are what upstream documents: the
      # builder makes loopback devices and mounts filesystems to lay the ISO
      # out, none of which works from a confined container.
      #
      # The storage mount is read-WRITE and has to be. bib runs a nested podman
      # against this graphroot; mounted :ro it dies on `mkdir
      # /var/lib/containers/storage/l: read-only file system` before it does
      # any work. /store and /rpmmd are mounted for space, not correctness --
      # left unmounted they land in the container's overlay on the root disk.
      - name: Build the installer ISO
        run: |
          sudo podman run --rm --privileged \
            --security-opt label=type:unconfined_t \
            -v /mnt/iso:/output \
            -v /var/lib/containers/storage:/var/lib/containers/storage \
            -v /mnt/store:/store \
            -v /mnt/rpmmd:/rpmmd \
            "${BIB}" \
              build \
              --type anaconda-iso \
              --rootfs "${ROOTFS}" \
              --progress verbose \
              "${IMAGE}:${TAG}"
          sudo chown -R "$(id -u):$(id -g)" /mnt/iso
          find /mnt/iso -name '*.iso' -printf '%p  %s bytes\n'
          df -h / /mnt

      - name: Name, checksum and sign
        run: |
          set -euo pipefail
          src=$(find /mnt/iso -name '*.iso' | head -1)
          [ -n "$src" ] || { echo "::error::no ISO was produced"; exit 1; }

          stamp=$(date -u +%Y%m%d)
          name="${{ matrix.variant }}-${FEDORA_VERSION}.${stamp}-x86_64.iso"
          mv "$src" "/mnt/iso/${name}"
          cd /mnt/iso

          # The checksum manifest is what a human verifies by hand; the
          # signature is what proves the manifest itself was not swapped.
          sha256sum "${name}" > "${name}.sha256"
          cosign sign-blob --yes \
            --output-signature "${name}.sig" \
            --output-certificate "${name}.pem" \
            "${name}"

          echo "ISO_NAME=${name}" >> "$GITHUB_ENV"
          cat "${name}.sha256"

      - name: Upload to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          R2_BUCKET: ${{ vars.R2_BUCKET }}
        run: |
          set -euo pipefail
          cd /mnt/iso
          for f in "${ISO_NAME}" "${ISO_NAME}.sha256" "${ISO_NAME}.sig" "${ISO_NAME}.pem"; do
            aws s3 cp "$f" "s3://${R2_BUCKET}/pulsar/iso/${f}" \
              --endpoint-url "${R2_ENDPOINT}"
          done
          # ...then the stable keys the site links to, written after the
          # immutable copies (same order as the SBOM flow) so a failed upload
          # cannot leave "latest" pointing at nothing. The checksum manifest
          # is REGENERATED with the latest filename, not copied: sha256sum -c
          # matches on the name in the file, and a manifest naming the dated
          # ISO fails against the bytes saved as -latest. The sig and pem
          # sign the bytes alone, so plain copies stay valid.
          latest="${{ matrix.variant }}-latest-x86_64.iso"
          sed "s|  ${ISO_NAME}\$|  ${latest}|" "${ISO_NAME}.sha256" > "${latest}.sha256"
          aws s3 cp "${ISO_NAME}" "s3://${R2_BUCKET}/pulsar/iso/${latest}" \
            --endpoint-url "${R2_ENDPOINT}"
          aws s3 cp "${latest}.sha256" "s3://${R2_BUCKET}/pulsar/iso/${latest}.sha256" \
            --endpoint-url "${R2_ENDPOINT}"
          aws s3 cp "${ISO_NAME}.sig" "s3://${R2_BUCKET}/pulsar/iso/${latest}.sig" \
            --endpoint-url "${R2_ENDPOINT}"
          aws s3 cp "${ISO_NAME}.pem" "s3://${R2_BUCKET}/pulsar/iso/${latest}.pem" \
            --endpoint-url "${R2_ENDPOINT}"
          echo "### ${ISO_NAME}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat "${ISO_NAME}.sha256" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
