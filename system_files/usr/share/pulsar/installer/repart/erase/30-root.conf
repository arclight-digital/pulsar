# Everything else: btrfs inside LUKS2, unlocked by the passphrase the
# installer passes as the key file. No SizeMaxBytes, so it takes the rest.
# An install without encryption (pulsar-install-disk --no-encrypt) uses a copy
# of this file with the Encrypt= line taken out: keep it to exactly one line.
[Partition]
Type=root
Format=btrfs
Label=pulsar
Encrypt=key-file
SizeMinBytes=32G
