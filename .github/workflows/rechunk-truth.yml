# ===========================================================================
# Which --from invocation actually reads the image we just built?
#
# The first run of this workflow answered the question it was written for.
# `--from localhost/toy:44` did not resolve out of containers-storage, and
# the tool did not fail: it fell back to treating the name as a REGISTRY
# reference and pulled it.
#
#   Trying to pull localhost/toy:44...
#   Error: initializing source docker://localhost/toy:44: pinging container
#   registry localhost: dial tcp [::1]:443: connect: connection refused
#
# `localhost` is not a registry, so the test failed loudly. Production's
# name IS one. `--from ghcr.io/arclight-digital/pulsar:44` has therefore
# been pulling the PUBLISHED image every night and re-chunking that, while
# the freshly built image sat in local storage untouched -- which is why
# every build since 44.20260806.1 shipped .1's content, and why it is the
# authored files that froze while RPM content appeared to move.
#
# The second run proved only that much, on the rootful variant. The other
# three never reached the question: two died mounting /mnt/oci (inside the
# tool image /mnt is an ostree symlink to /var/mnt, the same trap af9ad0a
# fixed for the store) and one died on an unseeded output layout, which the
# tool opens before it reads --from at all. Both are harness faults, fixed
# here: every variant now mounts where build.yml mounts and gets a seeded
# destination, so the only thing left varying is the --from reference.
#
# Run: gh workflow run rechunk-truth.yml
# ===========================================================================
name: rechunk-truth

on:
  workflow_dispatch:

jobs:
  truth:
    runs-on: ubuntu-latest
    steps:
      # the metadata diff at the end runs scripts/diff-chunk-metadata.sh
      - uses: actions/checkout@v7

      - name: Put container storage on the temp disk
        run: |
          sudo mkdir -p /mnt/podman && sudo chown "$(id -u):$(id -g)" /mnt/podman
          printf '[storage]\ndriver = "overlay"\ngraphroot = "/mnt/podman"\nrunroot = "/tmp/podman-run"\n' \
            > /tmp/storage.conf
          echo "CONTAINERS_STORAGE_CONF=/tmp/storage.conf" >> "$GITHUB_ENV"
          sudo mkdir -p /mnt/oci && sudo chown "$(id -u):$(id -g)" /mnt/oci

      # One marker per class of content that froze: a packaged file modified
      # after install, an unpackaged file, and a generated file in a
      # package-owned directory. The tag is what --from resolves.
      #
      # Two names for one build. Production's image is called
      # ghcr.io/arclight-digital/pulsar, which parses as a registry reference
      # and is why the fallback stayed silent for weeks; localhost/ does not,
      # and fails loudly. A fix has to hold for the registry-shaped name --
      # that is the one that lies -- so both are tested.
      - name: Build the toy image
        run: |
          set -euo pipefail
          {
            echo 'FROM quay.io/fedora-ostree-desktops/silverblue:44'
            printf 'RUN sed -i %ss|^VERSION=.*|VERSION="TOY"|%s /usr/lib/os-release \\\n' "'" "'"
            printf ' && echo TOY > /usr/lib/toy-unowned \\\n'
            printf ' && echo TOY > /usr/share/pixmaps/toy-generated\n'
          } > Containerfile.toy
          cat Containerfile.toy
          podman build -f Containerfile.toy \
            -t localhost/toy:44 \
            -t ghcr.io/arclight-digital/toy:44 .
          podman images

      - name: Which invocation reads local storage?
        run: |
          # Every variant here is EXPECTED to exit non-zero -- timeout kills
          # the ones that resolve, and the ones that fall back error out. The
          # runner invokes this with `bash -e`, which set -uo does not clear,
          # so the first attempt would take the whole step down before a
          # single verdict printed. It did exactly that on the first try.
          set +e
          set -uo pipefail

          # The tool opens the destination BEFORE it resolves --from, so an
          # unseeded layout masks the answer with an output error. build.yml
          # seeds one; so must every variant here, or it tests nothing.
          seed() {
            mkdir -p "/mnt/oci/$1/blobs/sha256"
            printf '{"imageLayoutVersion":"1.0.0"}' > "/mnt/oci/$1/oci-layout"
            printf '{"schemaVersion":2,"manifests":[]}' > "/mnt/oci/$1/index.json"
          }

          # Mounts are build.yml's, verbatim: host /mnt/podman and /mnt/oci
          # land at /var/mnt/... because inside the image /mnt is a symlink
          # to var/mnt, so the paths the tool is given still resolve.
          try() {
            local slot="$1" image="$2"; shift 2
            seed "${slot}"
            timeout 90 podman run --rm --privileged \
              -v /mnt/podman:/var/mnt/podman \
              -v /mnt/oci:/var/mnt/oci \
              -v /tmp/storage.conf:/etc/containers/storage.conf:ro \
              "${image}" \
              rpm-ostree compose build-chunked-oci --bootc --format-version 1 \
                "$@" \
                --output "oci:/mnt/oci/${slot}:build" > "/tmp/${slot}.log" 2>&1
          }

          # "Generating commit" = resolved from storage, which is the whole
          # question. "Trying to pull" = the silent fallback that caused this.
          verdict() {
            local name="$1" log="$2"
            if grep -q "Trying to pull" "${log}"; then
              echo "  ${name}: FELL BACK TO REGISTRY PULL"
            elif grep -qE "Generating commit|Building package mapping" "${log}"; then
              echo "  ${name}: RESOLVED FROM LOCAL STORAGE"
            else
              echo "  ${name}: inconclusive"
              tail -6 "${log}" | sed 's/^/      /'
            fi
          }

          # 1. The control: a bare name, which is what build.yml ships. Run
          #    against the registry-SHAPED name, because that is production's
          #    and the only one whose fallback can succeed at pulling.
          try a ghcr.io/arclight-digital/toy:44 --from ghcr.io/arclight-digital/toy:44
          verdict "bare registry-shaped name (as shipped)" /tmp/a.log

          # 2. The transport stated instead of inferred. If a ref cannot be
          #    read as a registry name, the fallback cannot fire silently.
          try b ghcr.io/arclight-digital/toy:44 \
            --from containers-storage:ghcr.io/arclight-digital/toy:44
          verdict "containers-storage: transport, registry-shaped name" /tmp/b.log

          # 3. Same transport, localhost name -- separates "the transport
          #    works" from "the name shape matters".
          try c localhost/toy:44 --from containers-storage:localhost/toy:44
          verdict "containers-storage: transport, localhost name" /tmp/c.log

          # 4. If the transport alone does not find it, the store it reads is
          #    the default one, not the graphroot storage.conf declares. This
          #    names the store in the reference itself.
          try d ghcr.io/arclight-digital/toy:44 \
            --from "containers-storage:[overlay@/mnt/podman+/tmp/podman-run]ghcr.io/arclight-digital/toy:44"
          verdict "containers-storage: with explicit store" /tmp/d.log

          echo
          echo "=== full output of each attempt ==="
          for f in a b c d; do
            echo "--- ${f} ---"
            head -20 "/tmp/${f}.log"
          done

      # A verdict of "resolved locally" is still an inference until the bytes
      # are read back. This runs the winning form to completion and greps the
      # chunked output for the marker: TOY can only be there if the tool read
      # the image this job built, since no such image was ever pushed.
      - name: Prove the chunked output holds the local content
        run: |
          set +e
          set -uo pipefail
          mkdir -p /mnt/oci/proof/blobs/sha256
          printf '{"imageLayoutVersion":"1.0.0"}' > /mnt/oci/proof/oci-layout
          printf '{"schemaVersion":2,"manifests":[]}' > /mnt/oci/proof/index.json
          for ref in \
            "containers-storage:ghcr.io/arclight-digital/toy:44" \
            "containers-storage:[overlay@/mnt/podman+/tmp/podman-run]ghcr.io/arclight-digital/toy:44"
          do
            echo "=== proving with --from ${ref} ==="
            rm -rf /mnt/oci/proof; mkdir -p /mnt/oci/proof/blobs/sha256
            printf '{"imageLayoutVersion":"1.0.0"}' > /mnt/oci/proof/oci-layout
            printf '{"schemaVersion":2,"manifests":[]}' > /mnt/oci/proof/index.json
            podman run --rm --privileged \
              -v /mnt/podman:/var/mnt/podman \
              -v /mnt/oci:/var/mnt/oci \
              -v /tmp/storage.conf:/etc/containers/storage.conf:ro \
              ghcr.io/arclight-digital/toy:44 \
              rpm-ostree compose build-chunked-oci --bootc --format-version 1 \
                --max-layers 200 \
                --from "${ref}" \
                --output "oci:/mnt/oci/proof:build" 2>&1 | tail -20 || continue

            # Look for the marker in the blobs the tool just wrote. An
            # earlier version copied the layout to /tmp first and the runner
            # was lost mid-step with no logs -- 2-3GB onto the small root
            # disk, to read one path out of a tree already sitting on the
            # big one. tar auto-detects the compression, so no -z guess.
            df -h / /mnt | sed 's/^/    /'
            found=no
            for blob in /mnt/oci/proof/blobs/sha256/*; do
              if tar -tf "${blob}" 2>/dev/null | grep -q 'usr/lib/toy-unowned'; then
                found=yes; break
              fi
            done
            echo "marker usr/lib/toy-unowned present in chunked output: ${found}"
            [ "${found}" = yes ] && { echo "WINNER: ${ref}"; break; }
          done

      # What the round trip does to modes and ownership, learned on a toy
      # before it can gate a nightly. build.yml runs this same script against
      # the real images and blocks the push on what it calls critical; this
      # run is where the benign baseline comes from, so a first failure there
      # is a finding rather than a surprise. Never fails this workflow -- it
      # is here to report, and the exit code is printed rather than obeyed.
      - name: What did the rechunk do to modes and ownership?
        run: |
          set +e
          [ -f /mnt/oci/proof/index.json ] || { echo "no chunked output to compare"; exit 0; }
          scripts/diff-chunk-metadata.sh \
            ghcr.io/arclight-digital/toy:44 /mnt/oci/proof build
          echo "diff-chunk-metadata exit: $?"
