# Default dev box. Applied with:
#
#   distrobox assemble create --file /usr/share/pulsar/distrobox.ini
#
# The premise of this image is that compilers and SDKs never land in it. The
# OS stays a fixed, signed artifact you rebase; the messy, fast-moving,
# version-pinned half of development lives in a container that can be deleted
# and recreated without touching the machine.
#
# This file is the default, not a policy -- copy it, edit it, keep your own.

[pulsar-dev]
image=registry.fedoraproject.org/fedora-toolbox:44
# Pull on create so a fresh box is current rather than whatever is cached.
pull=true
# Created, not started, by `assemble`. Starting is what `distrobox enter`
# does, and doing it here would spin up a container on every apply.
start_now=false
init=false
root=false
# The host's home is shared by default, so dotfiles, SSH keys and git config
# already work inside; nothing is copied in.
additional_packages="git git-lfs make cmake gcc gcc-c++ gdb ripgrep fd-find jq python3-pip python3-devel"

# NOTE on GPU work: nvidia=true wires the host driver into the box, but only
# makes sense on the nvidia variant. It is left OFF here because this file
# ships in BOTH images and a box that fails to start on the vanilla one is a
# worse default than a box without CUDA. Uncomment on an nvidia machine:
# nvidia=true
