<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  Bind the generic aliases to the brand faces.

  Without this, Host Grotesk and JetBrains Mono reach the desktop ONLY through
  the three gsettings keys in zz0-pulsar.gschema.override. Anything resolving a
  generic family instead (web content in Epiphany, GTK/libadwaita CSS naming
  sans-serif, Electron apps, LibreOffice defaults) renders in Noto Sans. Half
  the desktop branded and half not, invisibly.

  52-, deliberately. These rules use mode="prepend", which inserts before the
  matched sans-serif element and AFTER anything a lower-numbered file already
  inserted, so for prefer-style rules the earlier file wins. Fedora ships
  56-google-noto-sans-vf.conf, which is exactly why `fc-match sans-serif`
  returns Noto Sans today rather than the Adwaita Sans preferred at 59. Sorting
  at 52 puts these ahead of Noto at 56, while 50-user.conf and 51-local.conf
  stay ahead of us so a local admin override still wins.

  Binding is left WEAK (the fontconfig default) on purpose. A strong binding
  pins these families ahead of the lang-specific Noto entries and breaks
  non-Latin fallback, and Host Grotesk is Latin only, with no Cyrillic or
  Greek. Weak keeps the whole Noto chain reachable: verified that
  sans-serif:lang=ja still resolves to Noto Sans CJK JP, ar to Noto Sans
  Arabic, and ru to Noto Sans.

  Fontconfig 2.18 (Fedora 45) also matches on a font's generic family, and
  ranks that ABOVE the family list: 48-guessfamily.conf tags a sans-serif
  request as such, and only fonts tagged sans-serif can win it. Fonts are
  tagged when they are scanned, from their name, and "Host Grotesk" names no
  generic, so it was tagged nothing and Noto Sans won sans-serif despite the
  prepend below. The scan rule tags it. Fontconfig 2.17 (Fedora 44) has no
  generic family and rejects the rule with an error, so this file needs 2.18.
  Verified on 2.18.3: sans-serif and sans resolve to Host Grotesk, ja, ar, ru
  and el still reach Noto.

  Note for editors: no double hyphen anywhere in these comments. XML forbids it
  inside a comment, and fontconfig responds by discarding the ENTIRE file with
  only a warning on stderr, which during a container build means the branding
  silently does not apply.
-->
<fontconfig>
  <match target="scan">
    <test name="family"><string>Host Grotesk</string></test>
    <edit name="genericfamily" mode="assign"><const>sans-serif</const></edit>
  </match>

  <match target="pattern">
    <test name="family"><string>sans-serif</string></test>
    <edit name="family" mode="prepend"><string>Host Grotesk</string></edit>
  </match>

  <match target="pattern">
    <test name="family"><string>monospace</string></test>
    <edit name="family" mode="prepend"><string>JetBrains Mono</string></edit>
  </match>

  <!-- The reverse direction: asking for the family by name inherits the
       generic's fallback chain, so a missing glyph degrades instead of tofu. -->
  <alias>
    <family>Host Grotesk</family>
    <default><family>sans-serif</family></default>
  </alias>

  <alias>
    <family>JetBrains Mono</family>
    <default><family>monospace</family></default>
  </alias>
</fontconfig>
