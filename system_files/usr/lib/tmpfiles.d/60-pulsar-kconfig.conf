# The running kernel's build config where libbpf looks for it. libbpf reads
# /boot/config-$(uname -r) or /proc/config.gz to resolve CONFIG_* externs;
# Fedora builds no /proc/config.gz, and on ostree the config lives at
# /usr/lib/modules/<release>/config, so every BPF program with one --
# scx_bpfland included -- failed to load with "failed to open system
# Kconfig" (-EINVAL). One link per kernel, made at boot (%v is the running
# release); an image cannot ship it, /boot is not part of the image.
# This link is for other BPF tools (bpftrace, bcc). scx.service does not use
# it: /boot is not writable everywhere -- on a `bootc install`ed machine it is
# a read-only automount -- so the scheduler gets the directory below bound
# over /boot instead.
# Links from earlier kernels go first (removal runs before creation in one
# systemd-tmpfiles pass), so /boot holds only the running kernel's.
r /boot/config-*
L /boot/config-%v - - - - /usr/lib/modules/%v/config

# What scx.service binds over /boot, read-only: a directory holding only
# config-<running release>. In /run because /run is always writable and a
# directory bound over /boot creates nothing inside /boot, which SELinux would
# refuse (init_t may not create files in boot_t; 2026-10-01).
d /run/pulsar/kconfig 0755 root root -
L /run/pulsar/kconfig/config-%v - - - - /usr/lib/modules/%v/config
