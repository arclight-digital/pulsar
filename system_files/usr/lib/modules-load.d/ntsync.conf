# ntsync: the kernel's NT synchronization primitives, which Proton uses to
# implement Win32 sync objects (events, semaphores, mutexes) without the
# userspace round-trips esync/fsync needed.
#
# In /usr/lib, not /etc: this is image-native config, so it survives a rebase
# and is inspectable in the image. A hand-written /etc/modules-load.d/ntsync
# on a running machine does the same job but is exactly the mutable state
# this image exists to eliminate.
#
# The module is built in-tree on Fedora's kernel but is NOT autoloaded --
# nothing probes for it, so without this line /dev/ntsync never appears.
ntsync
